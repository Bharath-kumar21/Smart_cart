{% extends "admin/base_admin.html" %}

{% block title %}Add New Product - Admin Portal{% endblock %}

{% block content %}
<div class="row justify-content-center py-2 py-md-4">
    <div class="col-12 col-lg-8">
        <div class="sc-card p-3 p-sm-4 p-md-5 shadow-sm">
            <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between mb-4 pb-3 border-bottom gap-2">
                <div>
                    <h3 class="fw-bold mb-1 fs-4 fs-md-3"><i class="bi bi-plus-square-fill text-primary me-2"></i>Add New Product</h3>
                    <p class="text-muted small mb-0">Fill in the details below to add a new product to your inventory.</p>
                </div>
                <a href="/admin/item-list" class="btn btn-outline-secondary btn-sm align-self-start align-self-sm-center">
                    <i class="bi bi-arrow-left me-1"></i> Back to Products
                </a>
            </div>

            <form method="POST" action="/admin/add-item" enctype="multipart/form-data">
                <!-- Product Name -->
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="productName">Product Name <span class="text-danger">*</span></label>
                    <input type="text" id="productName" name="name" class="form-control" placeholder="e.g. Wireless Noise-Cancelling Headphones" required autofocus>
                </div>

                <!-- Category & Price in two columns -->
                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label fw-semibold" for="productCategory">Category <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-tag"></i></span>
                            <input type="text" id="productCategory" name="category" class="form-control" placeholder="e.g. Electronics" required>
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label fw-semibold" for="productPrice">Price (₹) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted">₹</span>
                            <input type="number" step="0.01" id="productPrice" name="price" class="form-control" placeholder="0.00" required min="0">
                        </div>
                    </div>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="productDesc">Detailed Description <span class="text-danger">*</span></label>
                    <textarea id="productDesc" name="description" class="form-control" rows="4" placeholder="Provide complete product specifications, warranty info, and highlights..." required></textarea>
                </div>

                <!-- Product Image Upload -->
                <div class="mb-4">
                    <label class="form-label fw-semibold" for="productImg">Product Image <span class="text-danger">*</span></label>
                    <input type="file" id="productImg" name="image" class="form-control" accept="image/*" required>
                    <div class="form-text small text-muted">Supported formats: JPEG, JPG, PNG, WEBP.</div>
                </div>

                <hr class="my-4 text-muted">

                <!-- Submit & Cancel -->
                <div class="d-flex flex-column flex-sm-row gap-2 justify-content-end">
                    <a href="/admin/item-list" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 py-2">
                        <i class="bi bi-cloud-upload-fill me-1"></i> Add Product
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
